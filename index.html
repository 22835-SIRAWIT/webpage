<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มเก็บข้อมูลนักเรียน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0284c7;
            --primary-hover: #0369a1;
            --secondary-color: #e0f2fe;
            --bg-color: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-light: #64748b;
            --border-color: #bae6fd;
            --focus-ring: #38bdf8;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0f2fe 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1), 0 8px 10px -6px rgba(2, 132, 199, 0.05);
            padding: 40px;
            border: 1px solid var(--border-color);
        }

        .form-header {
            text-align: center;
            margin-bottom: 35px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--secondary-color);
        }

        .form-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 12px;
            border-left: 4px solid var(--primary-color);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        input[type="tel"],
        input[type="date"],
        input[type="url"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            background-color: #ffffff;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        /* Option Controls (Radio & Checkbox) */
        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding-top: 6px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .option-item input[type="radio"],
        .option-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        /* Color Picker Special Style */
        input[type="color"] {
            -webkit-appearance: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 100%;
            height: 42px;
            padding: 4px;
            cursor: pointer;
            background: #ffffff;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 6px;
        }

        /* File Upload Styling */
        input[type="file"] {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        input[type="file"]::file-selector-button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--secondary-color);
            color: var(--primary-color);
            font-weight: 500;
            cursor: pointer;
            margin-right: 12px;
            transition: background-color 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #bae6fd;
        }

        /* Terms and Actions */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .terms-group input {
            margin-top: 3px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary-color);
        }

        .terms-group label {
            font-size: 0.9rem;
            color: var(--text-light);
            line-height: 1.4;
        }

        .button-group {
            display: flex;
            gap: 16px;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-reset {
            background-color: #f1f5f9;
            color: var(--text-light);
            border: 1px solid #cbd5e1;
        }

        .btn-reset:hover {
            background-color: #e2e8f0;
            color: var(--text-color);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .container {
                padding: 24px;
            }

            .grid-2, .grid-3 {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-header">
            <h1>แบบฟอร์มเก็บข้อมูลนักเรียน</h1>
            <p>กรุณากรอกข้อมูลให้ครบถ้วนเพื่อใช้ในการลงทะเบียนประวัตินักเรียน</p>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- 1. ข้อมูลส่วนตัว -->
            <div class="section">
                <div class="section-title">1. ข้อมูลส่วนตัว</div>
                <div class="grid-3">
                    <div class="form-group">
                        <label for="prefix">คำนำหน้า *</label>
                        <select id="prefix" name="prefix" required>
                            <option value="">-- เลือกคำนำหน้า --</option>
                            <option value="เด็กชาย">เด็กชาย</option>
                            <option value="เด็กหญิง">เด็กหญิง</option>
                            <option value="นาย">นาย</option>
                            <option value="นางสาว">นางสาว</option>
                        </select>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="fullname">ชื่อ-นามสกุล *</label>
                        <input type="text" id="fullname" name="fullname" placeholder="สมชาย ใจดี" required>
                    </div>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label for="nickname">ชื่อเล่น</label>
                        <input type="text" id="nickname" name="nickname" placeholder="ชาย">
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label for="student_id">เลขประจำตัวนักเรียน *</label>
                        <input type="text" id="student_id" name="student_id" placeholder="12345" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="dob">วันเดือนปีเกิด *</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>
                    <div class="form-group">
                        <label for="age">อายุ (ปี) *</label>
                        <input type="number" id="age" name="age" min="1" max="100" placeholder="15" required>
                    </div>
                </div>
            </div>

            <!-- 2. ข้อมูลการติดต่อ -->
            <div class="section">
                <div class="section-title">2. ข้อมูลการติดต่อ</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="email">อีเมล *</label>
                        <input type="email" id="email" name="email" placeholder="student@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="tel">เบอร์โทรศัพท์ *</label>
                        <input type="tel" id="tel" name="tel" placeholder="0812345678" pattern="[0-9]{9,10}" required>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label for="address">ที่อยู่ปัจจุบัน *</label>
                    <textarea id="address" name="address" placeholder="บ้านเลขที่ ถนน แขวง/ตำบล เขต/อำเภอ..." required></textarea>
                </div>
            </div>

            <!-- 3. ข้อมูลส่วนบุคคล -->
            <div class="section">
                <div class="section-title">3. ข้อมูลส่วนบุคคล</div>
                <div class="form-group">
                    <label>เพศ *</label>
                    <div class="option-group">
                        <label class="option-item">
                            <input type="radio" name="gender" value="male" required> ชาย
                        </label>
                        <label class="option-item">
                            <input type="radio" name="gender" value="female"> หญิง
                        </label>
                        <label class="option-item">
                            <input type="radio" name="gender" value="other"> อื่นๆ / ไม่ระบุ
                        </label>
                    </div>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label for="religion">ศาสนา</label>
                        <select id="religion" name="religion">
                            <option value="">-- เลือกศาสนา --</option>
                            <option value="พุทธ">พุทธ</option>
                            <option value="คริสต์">คริสต์</option>
                            <option value="อิสลาม">อิสลาม</option>
                            <option value="ฮินดู">ฮินดู</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="province">จังหวัด *</label>
                        <input type="text" id="province" name="province" placeholder="กรุงเทพมหานคร" required>
                    </div>
                    <div class="form-group">
                        <label for="blood_type">กรุ๊ปเลือด</label>
                        <select id="blood_type" name="blood_type">
                            <option value="">-- เลือก --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="O">O</option>
                            <option value="AB">AB</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 4. ความสนใจ -->
            <div class="section">
                <div class="section-title">4. ความสนใจ</div>
                <div class="form-group">
                    <label>งานอดิเรก</label>
                    <div class="option-group">
                        <label class="option-item">
                            <input type="checkbox" name="hobby[]" value="reading"> อ่านหนังสือ
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="hobby[]" value="sports"> เล่นกีฬา
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="hobby[]" value="music"> ฟังเพลง/เล่นดนตรี
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="hobby[]" value="gaming"> เล่นเกม
                        </label>
                        <label class="option-item">
                            <input type="checkbox" name="hobby[]" value="travel"> ท่องเที่ยว
                        </label>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="fav_color">สีที่ชอบ</label>
                        <input type="color" id="fav_color" name="fav_color" value="#0284c7">
                    </div>
                    <div class="form-group">
                        <label for="fav_website">เว็บไซต์ที่ชอบ</label>
                        <input type="url" id="fav_website" name="fav_website" placeholder="https://www.example.com">
                    </div>
                </div>
            </div>

            <!-- 5. ข้อมูลการศึกษา -->
            <div class="section">
                <div class="section-title">5. ข้อมูลการศึกษา</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="grade_level">ระดับชั้น *</label>
                        <select id="grade_level" name="grade_level" required>
                            <option value="">-- เลือกระดับชั้น --</option>
                            <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
                            <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
                            <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
                            <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
                            <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
                            <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="classroom">ห้องเรียน *</label>
                        <input type="text" id="classroom" name="classroom" placeholder="เช่น 1, 2, 301" required>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="program">แผนการเรียน</label>
                        <select id="program" name="program">
                            <option value="">-- เลือกแผนการเรียน --</option>
                            <option value="วิทยาศาสตร์-คณิตศาสตร์">วิทยาศาสตร์-คณิตศาสตร์</option>
                            <option value="ภาษาศาสตร์-คณิตศาสตร์">ศิลป์-คำนวณ</option>
                            <option value="ภาษาศาสตร์-ภาษาต่างประเทศ">ศิลป์-ภาษา</option>
                            <option value="ทั่วไป">ทั่วไป</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="gpa">เกรดเฉลี่ย (GPA)</label>
                        <input type="number" id="gpa" name="gpa" min="0.00" max="4.00" step="0.01" placeholder="0.00 - 4.00">
                    </div>
                </div>
            </div>

            <!-- 6. การอัปโหลดไฟล์ -->
            <div class="section">
                <div class="section-title">6. การอัปโหลดไฟล์</div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="profile_image">รูปภาพประจำตัว (Image Only) *</label>
                        <input type="file" id="profile_image" name="profile_image" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="documents">เอกสารเพิ่มเติม (PDF/Word)</label>
                        <input type="file" id="documents" name="documents" accept=".pdf,.doc,.docx">
                    </div>
                </div>
            </div>

            <!-- 7. ความคิดเห็นเพิ่มเติม -->
            <div class="section">
                <div class="section-title">7. ความคิดเห็นเพิ่มเติม</div>
                <div class="form-group full-width">
                    <label for="comments">แสดงความคิดเห็นหรือข้อเสนอแนะ</label>
                    <textarea id="comments" name="comments" placeholder="ระบุความคิดเห็นของคุณที่นี่..."></textarea>
                </div>
            </div>

            <!-- 8. ยืนยันข้อมูล -->
            <div class="terms-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">ข้าพเจ้าขอรับรองว่าข้อมูลข้างต้นเป็นความจริงทุกประการ และยอมรับเงื่อนไขการใช้งานและการจัดการข้อมูลส่วนบุคคล *</label>
            </div>

            <div class="button-group">
                <button type="reset" class="btn btn-reset">ล้างข้อมูล</button>
                <button type="submit" class="btn btn-submit">ส่งข้อมูล</button>
            </div>

        </form>
    </div>

</body>
</html>
