<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หน้าแรก | Student Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Cinzel:wght@900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --purple-bright: #d8b4fe;
            --purple-neon: #c084fc;
            --purple-glow: rgba(192, 132, 252, 0.6);
            --purple-intense: #a855f7;
            --bg-card: rgba(15, 7, 26, 0.75);
            --border-purple: rgba(192, 132, 252, 0.4);
            --text-primary: #ffffff;
            --text-muted: #e9d5ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Prompt', sans-serif;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            background-color: #05020a;
            overflow-x: hidden;
            position: relative;
        }

        #neon-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        a { text-decoration: none; transition: all 0.3s ease; }

        .navbar-header {
            background: rgba(10, 4, 18, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-purple);
            position: sticky; top: 0; z-index: 1000;
        }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 1200px; margin: 0 auto; padding: 1.2rem 2rem;
        }

        .nav-logo { font-size: 1.6rem; font-weight: 700; color: #fff; }
        .nav-logo span { color: var(--purple-neon); }

        .nav-menu { list-style: none; display: flex; gap: 2rem; }
        .nav-link { color: var(--text-muted); }
        .nav-link.active, .nav-link:hover { color: #fff; }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem; }
        .hero-container {
            display: flex; align-items: center; justify-content: space-between; gap: 3rem;
            background: var(--bg-card); padding: 3rem; border-radius: 24px;
            border: 1px solid var(--border-purple); backdrop-filter: blur(16px);
        }

        .hero-text { flex: 1.2; }
        .badge {
            display: inline-block; background: rgba(192, 132, 252, 0.12);
            border: 1px solid var(--purple-neon); color: var(--purple-bright);
            padding: 0.4rem 1.2rem; border-radius: 50px; font-size: 0.85rem; margin-bottom: 1.5rem;
        }

        .hero-title { font-size: 2.6rem; font-weight: 700; margin-bottom: 1.2rem; }
        .gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .hero-actions { display: flex; gap: 1.2rem; flex-wrap: wrap; margin-top: 1.5rem; }
        .btn { padding: 0.8rem 1.8rem; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: var(--purple-intense); color: #fff; border: none; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--border-purple); }
        .btn-atomic { background: #000; color: #c084fc; border: 2px solid #c084fc; box-shadow: 0 0 15px #c084fc; }

        .hero-visual { flex: 0.8; display: flex; justify-content: center; }
        .profile-card-wrapper {
            width: 280px; height: 350px; border-radius: 20px;
            border: 2px solid var(--purple-neon); background: #1a0b2e;
            display: flex; align-items: center; justify-content: center; color: var(--text-muted);
        }

        /* Overlay System */
        #atomic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.95); z-index: 99999; display: none;
            justify-content: center; align-items: center;
        }
        #atomic-overlay.active { display: flex; }

        .slash-line {
            position: absolute; top: 50%; left: -20%; width: 140%; height: 8px;
            background: linear-gradient(90deg, transparent 0%, #fff 50%, #c084fc 100%);
            transform: rotate(-15deg) scaleX(0); transform-origin: left center;
            z-index: 100; pointer-events: none;
        }
        #atomic-overlay.slashing .slash-line {
            animation: slashAnim 0.25s forwards;
        }
        @keyframes slashAnim {
            0% { transform: rotate(-15deg) scaleX(0); opacity: 1; }
            100% { transform: rotate(-15deg) scaleX(1); opacity: 0; }
        }

        #atomic-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <canvas id="neon-canvas"></canvas>

    <div id="atomic-overlay">
        <div class="slash-line" id="slash-line"></div>
        <canvas id="atomic-canvas"></canvas>
    </div>

    <header class="navbar-header">
        <nav class="navbar">
            <a href="#" class="nav-logo">PORTFOLIO<span>.M3</span></a>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active">หน้าแรก</a></li>
                <li><a href="#" class="nav-link">ประวัติส่วนตัว</a></li>
                <li><a href="#" class="nav-link">ติดต่อ</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero-container">
            <div class="hero-text">
                <div class="badge">I AM ATOMIC</div>
                <h1 class="hero-title">สวัสดีครับ! <span class="gradient-text">สิรวิชญ์ ตระกลบุษบง</span></h1>
                <p>นักเรียนชั้นมัธยมศึกษาปีที่ 3/2 โรงเรียนจอมทอง</p>
                <div class="hero-actions">
                    <button onclick="triggerAtomic()" class="btn btn-atomic">🔮 กดปลดปล่อยพลัง</button>
                </div>
            </div>
            <div class="hero-visual">
                <div class="profile-card-wrapper">
                    <span>[ รูปโปรไฟล์ ]</span>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Background particles
        const bgCanvas = document.getElementById('neon-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;

        let particles = Array.from({length: 50}, () => ({
            x: Math.random() * bgCanvas.width,
            y: Math.random() * bgCanvas.height,
            size: Math.random() * 2 + 1,
            speedY: Math.random() * 0.5 - 0.25
        }));

        function drawBg() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = '#c084fc';
            particles.forEach(p => {
                p.y += p.speedY;
                if(p.y < 0 || p.y > bgCanvas.height) p.speedY *= -1;
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                bgCtx.fill();
            });
            requestAnimationFrame(drawBg);
        }
        drawBg();

        // Atomic Effect Engine
        const atomicCanvas = document.getElementById('atomic-canvas');
        const ctx = atomicCanvas.getContext('2d');
        atomicCanvas.width = window.innerWidth;
        atomicCanvas.height = window.innerHeight;

        let shatterParticles = [];

        class ShatterParticle {
            constructor(x, y, char) {
                this.x = x; this.y = y; this.char = char;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 3;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vy += 0.2; this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = "bold 40px 'Cinzel', serif";
                ctx.fillStyle = '#c084fc';
                ctx.fillText(this.char, this.x, this.y);
                ctx.restore();
            }
        }

        function triggerAtomic() {
            const overlay = document.getElementById('atomic-overlay');
            overlay.classList.add('active');
            shatterParticles = [];

            let startTime = performance.now();
            let isShattered = false;

            function render(now) {
                let elapsed = now - startTime;
                ctx.clearRect(0, 0, atomicCanvas.width, atomicCanvas.height);

                let cx = atomicCanvas.width / 2;
                let cy = atomicCanvas.height / 2;

                if (elapsed < 1200) {
                    ctx.save();
                    ctx.font = "900 60px 'Cinzel', serif";
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 30;
                    ctx.fillText("I AM ATOMIC", cx, cy);
                    ctx.restore();
                } else if (!isShattered) {
                    overlay.classList.add('slashing');
                    isShattered = true;
                    const text = "I AM ATOMIC";
                    for (let i = 0; i < text.length; i++) {
                        if (text[i] !== ' ') {
                            for(let k=0; k<3; k++) {
                                shatterParticles.push(new ShatterParticle(cx - 150 + (i * 25), cy, text[i]));
                            }
                        }
                    }
                }

                if (isShattered) {
                    shatterParticles.forEach(p => { p.update(); p.draw(); });
                }

                if (elapsed < 3000) {
                    requestAnimationFrame(render);
                } else {
                    overlay.classList.remove('active', 'slashing');
                }
            }
            requestAnimationFrame(render);
        }
    </script>
</body>
    </html>
