<!-- ================= ATOMIC EFFECT OVERLAY ================= -->

<!-- ปุ่มสำหรับกดเปิดเอฟเฟกต์ (กดปุ่มนี้เพื่อเริ่มทำงาน) -->
<button class="atomic-trigger-btn" onclick="triggerAtomic()">
    RELEASE ATOMIC POWER
</button>

<div id="atomicOverlay">

    <!-- ปุ่มกดปิดมุมขวาบน -->
    <button class="atomic-close-btn" onclick="closeAtomic()">✕</button>

    <canvas id="atomicCanvas"></canvas>

    <div class="atomic-title">
        <div class="atomic-small">LIMITER RELEASE</div>

        <div class="atomic-word">
            I AM ATOMIC
        </div>

        <!-- ดาบแสง -->
        <div class="slash"></div>

        <div class="atomic-sub">
            POWER RELEASE
        </div>
    </div>

</div>


<style>

/* ปุ่มเปิดเอฟเฟกต์แบบแต่งสวยงาม */
.atomic-trigger-btn {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 36px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    color: #fff;
    background: linear-gradient(135deg, #7000ff, #b000ff);
    border: none;
    border-radius: 50px;
    box-shadow: 0 0 20px rgba(176, 0, 255, 0.6);
    cursor: pointer;
    transition: all 0.3s ease;
    z-index: 100;
}

.atomic-trigger-btn:hover {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow: 0 0 35px rgba(208, 0, 255, 0.9);
}

/* ================= OVERLAY ================= */

#atomicOverlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            rgba(190,0,255,.45),
            rgba(50,0,100,.35) 30%,
            rgba(0,0,0,.97) 75%
        );
}

#atomicOverlay.active{
    display:flex;
}

/* ปุ่มปิด (Close Button) */
.atomic-close-btn {
    position: absolute;
    top: 20px;
    right: 25px;
    z-index: 100;
    background: transparent;
    border: none;
    color: rgba(255, 255, 255, 0.7);
    font-size: 28px;
    cursor: pointer;
    transition: color 0.2s ease;
}

.atomic-close-btn:hover {
    color: #fff;
}

/* CANVAS */
#atomicCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= TEXT ================= */

.atomic-title{
    position:relative;
    z-index:10;
    text-align:center;
    pointer-events:none;
}

.atomic-small{
    font-size:14px;
    letter-spacing:10px;
    color:#e9c7ff;
    text-shadow:
        0 0 10px #b000ff,
        0 0 25px #8a00ff;
    opacity:0;
}

#atomicOverlay.active .atomic-small {
    animation: smallIn .5s .15s forwards;
}

.atomic-word{
    position:relative;
    margin-top:15px;
    font-family:Georgia,serif;
    font-size: clamp(45px, 9vw, 125px);
    font-weight:900;
    letter-spacing:5px;
    white-space:nowrap;
    color:white;
    text-shadow:
        0 0 5px white,
        0 0 15px #fff,
        0 0 35px #d000ff,
        0 0 70px #9700ff,
        0 0 130px #6200ff;
    opacity:0;
}

#atomicOverlay.active .atomic-word {
    animation: atomicAppear .65s .3s both;
}

/* ================= SWORD ================= */

.slash{
    position:absolute;
    z-index:20;
    left:-15%;
    top:50%;
    width:130%;
    height:7px;
    transform: translateY(-50%) rotate(-8deg) scaleX(0);
    transform-origin:center;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            #ffffff 15%,
            #ffffff 48%,
            #ffffff 52%,
            #d82cff 75%,
            transparent 100%
        );
    box-shadow:
        0 0 5px white,
        0 0 15px white,
        0 0 30px #d000ff,
        0 0 60px #9500ff,
        0 0 100px #7000ff;
}

#atomicOverlay.active .slash {
    animation: swordSlash .55s 1.15s cubic-bezier(.15,.8,.2,1) forwards;
}

.slash::before{
    content:"";
    position:absolute;
    left:0;
    top:-20px;
    width:100%;
    height:45px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            rgba(190,0,255,.5),
            transparent
        );
    filter:blur(15px);
}

/* ================= EXPLOSION FLASH ================= */

#atomicOverlay.explode::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:30;
    background:white;
    opacity:0;
    pointer-events:none;
    animation: explosionFlash .55s ease-out;
}

@keyframes explosionFlash{
    0%{ opacity:0; }
    12%{ opacity:.95; }
    25%{ opacity:.2; }
    100%{ opacity:0; }
}

/* ================= TEXT ANIMATIONS ================= */

@keyframes smallIn{
    from{
        opacity:0;
        transform: translateY(20px);
    }
    to{
        opacity:1;
        transform: translateY(0);
    }
}

@keyframes atomicAppear{
    0%{
        opacity:0;
        transform: scale(.3) blur(20px);
    }
    70%{
        opacity:1;
        transform: scale(1.08);
    }
    100%{
        opacity:1;
        transform: scale(1);
    }
}

@keyframes swordSlash{
    0%{
        transform: translateY(-50%) rotate(-8deg) scaleX(0);
        opacity:0;
    }
    20%{
        opacity:1;
    }
    100%{
        transform: translateY(-50%) rotate(-8deg) scaleX(1);
        opacity:1;
    }
}

/* ================= SUB ================= */

.atomic-sub{
    margin-top:25px;
    font-size:13px;
    letter-spacing:8px;
    color:#d7b8e8;
    opacity:0;
}

#atomicOverlay.active .atomic-sub {
    animation: subIn .5s 1.7s forwards;
}

@keyframes subIn{
    from{
        opacity:0;
        transform: translateY(15px);
    }
    to{
        opacity:.8;
        transform: translateY(0);
    }
}

/* ================= MOBILE ================= */

@media(max-width:600px){
    .atomic-word{
        font-size:42px;
        letter-spacing:2px;
    }
    .atomic-small{
        font-size:10px;
        letter-spacing:5px;
    }
}

</style>


<script>

/* =================================================
   ATOMIC SWORD SYSTEM
================================================= */

const atomicOverlay = document.getElementById("atomicOverlay");
const atomicCanvas = document.getElementById("atomicCanvas");
const actx = atomicCanvas.getContext("2d");

let particles = [];
let animationFrame;
let startTime;

/* ================= RESIZE ================= */

function resizeAtomic(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    atomicCanvas.width = window.innerWidth * dpr;
    atomicCanvas.height = window.innerHeight * dpr;

    atomicCanvas.style.width = window.innerWidth + "px";
    atomicCanvas.style.height = window.innerHeight + "px";

    actx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resizeAtomic();
window.addEventListener("resize", resizeAtomic);

/* ================= CREATE EXPLOSION ================= */

function createExplosion(){
    particles = [];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    for(let i = 0; i < 400; i++){
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 16 + 3;

        particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 1,
            life: 1,
            decay: 0.008 + Math.random() * 0.018
        });
    }
}

/* ================= DRAW ================= */

function drawExplosion(){
    actx.clearRect(0, 0, window.innerWidth, window.innerHeight);

    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;

    /* แสงพลังงานตรงกลาง */
    const gradient = actx.createRadialGradient(cx, cy, 1, cx, cy, window.innerWidth * 0.65);
    gradient.addColorStop(0, "rgba(255,255,255,.95)");
    gradient.addColorStop(0.04, "rgba(235,100,255,.9)");
    gradient.addColorStop(0.15, "rgba(190,0,255,.55)");
    gradient.addColorStop(0.4, "rgba(100,0,255,.2)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");

    actx.fillStyle = gradient;
    actx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    /* วงแหวนพลังงานกระจาย */
    const elapsed = performance.now() - startTime;

    for(let i = 0; i < 5; i++){
        const radius = elapsed * 0.7 + i * 30;

        actx.beginPath();
        actx.arc(cx, cy, radius, 0, Math.PI * 2);
        actx.strokeStyle = `rgba(205, 70, 255, ${Math.max(0, 0.5 - radius / window.innerWidth)})`;
        actx.lineWidth = 3;
        actx.shadowBlur = 25;
        actx.shadowColor = "#a000ff";
        actx.stroke();
    }

    /* อนุภาคพิกเซลพลังงาน */
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= p.decay;

        if(p.life > 0){
            actx.beginPath();
            actx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
            actx.fillStyle = `rgba(240, 180, 255, ${p.life})`;
            actx.shadowBlur = 20;
            actx.shadowColor = "#c000ff";
            actx.fill();
        }
    });

    animationFrame = requestAnimationFrame(drawExplosion);
}

/* ================= TRIGGER FUNCTION ================= */

function triggerAtomic(){
    // ลบ class active ชั่วคราวเพื่อรีเซ็ตแอนิเมชันหากกดซ้ำ
    atomicOverlay.classList.remove("active", "explode");

    // Re-trigger layout calculation
    void atomicOverlay.offsetWidth;

    atomicOverlay.classList.add("active");
    document.body.style.overflow = "hidden";

    resizeAtomic();
    startTime = performance.now();
    createExplosion();

    cancelAnimationFrame(animationFrame);
    animationFrame = requestAnimationFrame(drawExplosion);

    /* แฟลชระเบิดหลังดาบฟัน */
    setTimeout(() => {
        atomicOverlay.classList.add("explode");
    }, 1700);

    /* ปิดหน้าจออัตโนมัติเมื่อแสดงผลจบ (5 วินาที) */
    setTimeout(() => {
        closeAtomic();
    }, 5500);
}

/* ================= CLOSE FUNCTION ================= */

function closeAtomic(){
    atomicOverlay.classList.remove("active", "explode");
    document.body.style.overflow = "";

    cancelAnimationFrame(animationFrame);
    actx.clearRect(0, 0, window.innerWidth, window.innerHeight);
}

/* ================= ESC KEY ================= */

document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
        closeAtomic();
    }
});

    </script>
